name: Deploy Portfolio

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  AWS_REGION: ap-southeast-1
  S3_BUCKET: cloud2026-portfolio-website
  CLOUDFRONT_DISTRIBUTION_ID: E2IOSMWUGMP3LF

jobs:
  # ──────────────────────────────────────────
  # STAGE 1: Security scan with Checkov
  # ──────────────────────────────────────────
  security-scan:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true
          output_format: cli

  # ──────────────────────────────────────────
  # STAGE 2: Terraform validate
  # ──────────────────────────────────────────
  terraform-validate:
    name: "📋 Terraform Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

  # ──────────────────────────────────────────
  # STAGE 3: Deploy website to S3
  # ──────────────────────────────────────────
  deploy-website:
    name: "🚀 Deploy Website"
    runs-on: ubuntu-latest
    needs: [security-scan, terraform-validate]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync website to S3
        run: |
          aws s3 sync website/ s3://${{ env.S3_BUCKET }} \
            --delete \
            --content-type "text/html" \
            --exclude "*.css" \
            --exclude "*.js"
          aws s3 sync website/ s3://${{ env.S3_BUCKET }} \
            --delete \
            --include "*.css" \
            --content-type "text/css"
          aws s3 sync website/ s3://${{ env.S3_BUCKET }} \
            --delete \
            --include "*.js" \
            --content-type "application/javascript"

  # ──────────────────────────────────────────
  # STAGE 4: Invalidate CloudFront cache
  # ──────────────────────────────────────────
  invalidate-cache:
    name: "🔄 Invalidate CloudFront Cache"
    runs-on: ubuntu-latest
    needs: [deploy-website]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"